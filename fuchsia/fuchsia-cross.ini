[constants]
clang_bin = '@DIRNAME@' / 'tools/clang/bin'
sdk_arch = '@DIRNAME@' / '../subprojects/fuchsia-sdk/arch/x64'
sysroot = sdk_arch / 'sysroot'
target = 'x86_64-unknown-fuchsia'

[binaries]
c = [clang_bin / 'clang', '--target=' + target, '--sysroot=' + sysroot]
cpp = [clang_bin / 'clang++', '--target=' + target, '--sysroot=' + sysroot]
ar = clang_bin / 'llvm-ar'
strip = clang_bin / 'llvm-strip'
nm = clang_bin / 'llvm-nm'
objcopy = clang_bin / 'llvm-objcopy'
c_ld = clang_bin / 'ld.lld'
cpp_ld = clang_bin / 'ld.lld'
rust = ['rustc', '--target=' + target, '-C', 'link-arg=-L' + sdk_arch / 'lib']

[built-in options]
c_link_args = ['-L' + sdk_arch / 'lib']
cpp_link_args = ['-L' + sdk_arch / 'lib', '-stdlib=libc++', '-unwindlib=libunwind', '-static-libstdc++', '-static-libgcc', '-Wl,-Bstatic', '-lunwind', '-Wl,-Bdynamic']

[host_machine]
system = 'fuchsia'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
